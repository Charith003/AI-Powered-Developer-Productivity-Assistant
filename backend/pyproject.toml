[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "devpilot-api"
version = "0.4.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic-settings>=2.5,<3", "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "alembic>=1.13,<2", "pwdlib[argon2]>=0.2,<1", "PyJWT>=2.9,<3", "email-validator>=2.2,<3", "openai>=2.0,<3"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "httpx>=0.27,<1", "ruff>=0.8,<1"]
review = ["ruff>=0.8,<1", "bandit>=1.7,<2"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["B008"]

[tool.hatch.build.targets.wheel]
packages = ["app"]
