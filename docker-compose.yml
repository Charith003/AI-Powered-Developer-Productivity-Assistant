services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: devpilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in root .env}
      POSTGRES_DB: devpilot
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devpilot -d devpilot"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://devpilot:${POSTGRES_PASSWORD}@db:5432/devpilot
      ENVIRONMENT: development
      FRONTEND_ORIGIN: http://localhost:3000
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in root .env}
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
  web:
    build: .
    environment:
      API_URL: http://api:8000
    ports: ["3000:3000"]
    depends_on: [api]
volumes:
  pgdata:

